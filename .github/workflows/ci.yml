# 🧱 VALLUM — wał graniczny Imperium (bramka Prawa XXI po stronie GitHuba).
#
# IMIĘ (ZASADA NOMENKLATURY): LIMES to bramka LOKALNA, którą Architekt uruchamia sam przed
# commitem. VALLUM to ten sam mur, ale postawiony POZA jego maszyną — pilnuje wtedy, gdy
# Architekt zapomni, gdy sesja padnie w połowie, gdy commit wejdzie z innego urządzenia.
# LIMES zależy od dyscypliny; VALLUM nie zależy od niczyjej.
#
# DLACZEGO POWSTAŁ (KM1, decyzja Cezara 2026-08-06): `.github/` NIE ISTNIAŁO — zmierzone,
# nie zapamiętane. Bramka Prawa XXI miała 24 warstwy i ZERO egzekutorów poza terminalem
# Architekta. To ta sama klasa co kontrakt append-only: reguła deklarowana, egzekwowana
# przez nikogo.
#
# ⚠️ TEN PLIK MUSI UMIEĆ ŚWIECIĆ NA CZERWONO. CI, które nigdy nie czerwienieje, jest tapetą
# (warunek nienaruszalny Cezara). Każda z trzech nóg jest udowodniona OSOBNĄ mutacją —
# jedna mutacja wywalająca wszystko dowodzi tylko, że *coś* działa. Dowody: docs/LOG_ZMIAN.md.

name: VALLUM — bramka Prawa XXI

on:
  push:
    branches: ["**"]   # każda gałąź, bo Architekt commituje lokalnie, a pushuje Cezar
  pull_request:
  workflow_dispatch:   # Cezar może wywołać wał ręcznie, bez czekania na push
# ŚWIADOMA REDUNDANCJA, nie przeoczenie: gałąź z otwartym PR-em uruchomi wał DWA razy
# (raz z `push`, raz z `pull_request` — różne refy, więc `concurrency` ich nie scali).
# Zostawione celowo: repo jest PUBLIC, więc minuty Actions są darmowe, a oba sygnały mają
# inną wartość — `push` chroni każdą gałąź od razu, `pull_request` pokazuje wynik przy
# recenzji. Gdyby repo kiedyś stało się prywatne, TO JEST pierwsze miejsce do zacieśnienia.

permissions:
  contents: read       # wał CZYTA repo i nic w nim nie zmienia

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # nowy push unieważnia poprzedni bieg tej samej gałęzi

jobs:
  bramka:
    name: bramka (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # ZMIERZONE 2026-08-06 na czystym klonie (klasa PEDES, 4 wątki): testy 560 s,
    # audyt 13 s, ruff <1 s. Limit 30 min to ~3× zapas, a nie zgadywanka.
    # (Pierwszy realny bieg na runnerze GitHuba zweryfikuje ten zapas — patrz LOG_ZMIAN.)
    timeout-minutes: 30
    strategy:
      fail-fast: false   # chcemy WIEDZIEĆ, czy pada jedna wersja Pythona czy obie
      matrix:
        python: ["3.10", "3.11"]
        # 3.11 = wersja lokalu Cezara (PORTITOR). 3.10 = dolna granica z pyproject.toml.
        # Macierz jest EGZEKUTOREM tej granicy: `requires-python = ">=3.10"` przestaje
        # być deklaracją na wiarę w chwili, gdy 3.10 realnie biega tu co push.

    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Zależności (PEŁNY requirements.txt — wał ma mierzyć to samo, co lokal)
        run: |
          python -m pip install --upgrade pip
          # Jedno źródło prawdy = requirements.txt, BEZ wyjątków. Pierwotnie chciałem
          # odsiać TA-Lib (wrapper wymaga biblioteki C) — POMIAR to obalił dwukrotnie:
          #  (1) bieg z zablokowanym TA-Lib: 138 z 3539 testów PADA, a audyt czerwienieje
          #      na W12. Brama Kalkulatora świadomie rzuca RuntimeError zamiast liczyć
          #      po swojemu (Prawo I: „brak fallbacku do ręcznej matematyki"), więc brak
          #      TA-Lib to NIE pominięcia, tylko lawina porażek.
          #  (2) PyPI (sprawdzone 2026-08-06): TA-Lib 0.6.6 publikuje wheels manylinux_2_28
          #      dla cp310 i cp311 — dokładnie naszej macierzy. Kompilacja C nie jest
          #      potrzebna, więc odsiewanie niczego nie oszczędzało, a psuło wierność wału.
          pip install -r requirements.txt

      - name: Czym mierzymy (twarda weryfikacja środowiska — cisza nie jest dowodem)
        run: |
          python -VV
          python -m ruff --version
          # TWARDY assert, nie nota informacyjna: gdyby TA-Lib nie wszedł, wał zaświeciłby
          # czerwono na 138 sposobów naraz, zakrywając JEDNĄ prawdziwą przyczynę. Lepiej
          # paść tutaj, w jednym czytelnym zdaniu.
          python -c "import talib; print('TA-Lib OK:', talib.__version__)"

      # ── Noga 1/3: RUFF ──────────────────────────────────────────────────────────
      # OSOBNY, TWARDY krok — NIE polegamy na Warstwie 13 audytu. Zmierzone
      # (audyt_spojnosci.py:1422-1427): gdy ruffa brak, W13 wypisuje notę i przepuszcza
      # audyt ZIELONO. To celowe (audyt ma działać w minimalnym środowisku), ale w CI
      # oznaczałoby ciszę udającą spokój: linter nigdy nie pobiegł, a wał świeci zielono.
      - name: Noga 1/3 — RUFF (bugi i martwy kod)
        run: python -m ruff check imperium tests narzedzia skrypty --output-format concise

      # ── Noga 2/3: AUDYT SPÓJNOŚCI ───────────────────────────────────────────────
      # 24 warstwy Prawa XXI. Idzie PRZED testami, bo trwa 13 s wobec 560 s — rozjazd
      # dokumentów wykrywamy w kilkanaście sekund, nie po dziesięciu minutach.
      - name: Noga 2/3 — AUDYT SPÓJNOŚCI (Prawo XXI, 24 warstwy)
        run: python narzedzia/audyt_spojnosci.py

      # ── Noga 3/3: TESTY ─────────────────────────────────────────────────────────
      # Bramką Imperium jest run_tests.py, NIE pytest — więc wał uruchamia dokładnie to,
      # co Architekt uruchamia lokalnie. Gdyby CI wołało pytest, mierzyłoby inny zestaw
      # niż bramka i „zielone CI" nie znaczyłoby „zielona bramka".
      - name: Noga 3/3 — TESTY (runner Imperium)
        run: python tests/run_tests.py
